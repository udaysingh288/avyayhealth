<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Warm Recovery - Conversational Check-in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#085041",
          "background-light": "#f6f8f6",
          "background-dark": "#102213",
          "warm-oatmeal": "#FAF7F2",
          "forest-slate": "#3D4035",
          "sage-muted": "#9CA39A",
          "mint-light": "#F0F4F1",
        },
        fontFamily: {
          "display": ["Manrope", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
        boxShadow: {
          'soft': '0 8px 24px rgba(124, 169, 130, 0.08)',
        }
      },
    },
  }
</script>
<style>
  body {
    font-family: 'Manrope', sans-serif;
    background-color: #FAF7F2;
    color: #3D4035;
  }
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-warm-oatmeal antialiased flex flex-col min-h-screen relative overflow-hidden">
<!-- Header Section -->
<header class="bg-warm-oatmeal px-6 py-5 flex items-center justify-between z-10 sticky top-0">
<button aria-label="Close Check-in" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-warm-oatmeal">
<span class="material-symbols-outlined text-forest-slate" data-icon="close">close</span>
</button>
<div class="flex-1 flex flex-col items-center">
<h1 class="text-lg font-bold text-forest-slate tracking-tight">Daily Check-in</h1>
<!-- Minimal Progress Indicator -->
<div class="flex gap-1.5 mt-1.5">
<div class="h-1.5 w-6 rounded-full bg-primary"></div>
<div class="h-1.5 w-6 rounded-full bg-sage-muted/30"></div>
<div class="h-1.5 w-6 rounded-full bg-sage-muted/30"></div>
</div>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Chat Feed Container -->
<main class="flex-1 overflow-y-auto px-6 pb-32 pt-4 flex flex-col gap-6 hide-scrollbar relative z-0">
<!-- System Message Bubble -->
<div class="flex items-end gap-3 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-mint-light flex items-center justify-center shrink-0 border border-black/5 shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<div class="bg-white shadow-soft rounded-2xl rounded-bl-sm p-4 text-[15px] leading-relaxed text-forest-slate">
        Good morning, Sarah! We're glad to see you checking in today. Let's start with how you're feeling overall.
      </div>
</div>
<!-- System Message Bubble -->
<div class="flex items-end gap-3 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-mint-light flex items-center justify-center shrink-0 border border-black/5 shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<div class="bg-white shadow-soft rounded-2xl rounded-bl-sm p-4 text-[15px] leading-relaxed text-forest-slate">
        How is your pain level today compared to yesterday?
      </div>
</div>
<!-- User Message Bubble -->
<div class="flex items-end gap-3 justify-end w-full">
<div class="bg-primary shadow-soft rounded-2xl rounded-br-sm p-4 text-[15px] font-medium leading-relaxed text-white max-w-[80%]">
        A little sore
      </div>
</div>
<!-- System Message Bubble (Loading/Typing) -->
<div class="flex items-end gap-3 max-w-[85%] mt-2">
<div class="w-8 h-8 rounded-full bg-mint-light flex items-center justify-center shrink-0 border border-black/5 shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<div class="bg-white shadow-soft rounded-2xl rounded-bl-sm p-4 flex items-center gap-1.5 h-[52px]">
<div class="w-2 h-2 rounded-full bg-sage-muted/50"></div>
<div class="w-2 h-2 rounded-full bg-sage-muted/50"></div>
<div class="w-2 h-2 rounded-full bg-sage-muted/50"></div>
</div>
</div>
</main>
<!-- Quick-Reply Bottom Area -->
<footer class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-warm-oatmeal via-warm-oatmeal/95 to-transparent pt-12 pb-8 z-20">
<div class="px-6 flex overflow-x-auto gap-3 hide-scrollbar pb-2 snap-x">
<!-- Option 1 -->
<button class="snap-start shrink-0 px-6 py-3.5 rounded-full border-2 border-primary bg-transparent text-forest-slate font-semibold text-[15px] hover:bg-primary/5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-warm-oatmeal">
        No pain
      </button>
<!-- Option 2 (Active state) -->
<button class="snap-start shrink-0 px-6 py-3.5 rounded-full border-2 border-primary bg-primary text-white font-bold text-[15px] shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-warm-oatmeal">
        A little sore
      </button>
<!-- Option 3 -->
<button class="snap-start shrink-0 px-6 py-3.5 rounded-full border-2 border-primary bg-transparent text-forest-slate font-semibold text-[15px] hover:bg-primary/5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-warm-oatmeal">
        Hurts a lot
      </button>
<!-- Option 4 -->
<button class="snap-start shrink-0 px-6 py-3.5 rounded-full border-2 border-primary bg-transparent text-forest-slate font-semibold text-[15px] hover:bg-primary/5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-warm-oatmeal">
        I need help
      </button>
</div>
</footer>
</body></html>
