<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daily Check-in - Avyay Health</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#085041",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111a21",
                        "surface": "#FFFFFF",
                        "text-main": "#0F172A",
                        "muted": "#64748B",
                        "border-light": "#E2E8F0",
                        "error": "#DC2626"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["IBM Plex Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "0.25rem",
                        "md": "0.5rem",
                        "lg": "0.75rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "clinical": "0 2px 4px rgba(8, 80, 65, 0.08)"
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex flex-col relative font-display">
<!-- Minimal Header / Back Button -->
<header class="flex items-center justify-between p-4 bg-surface border-b border-border-light">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 text-text-main">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<span class="text-sm font-semibold text-muted">Step 1 of 5</span>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<!-- Progress Bar -->
<div class="w-full h-1 bg-border-light">
<div class="h-full bg-primary" style="width: 20%;"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col px-6 pt-8 pb-24">
<!-- Question Header -->
<h1 class="text-[24px] font-bold text-text-main leading-tight mb-8">
            What is your temperature today?
        </h1>
<!-- Form Input Field -->
<div class="flex flex-col gap-2">
<label class="sr-only" for="temperature-input">Temperature</label>
<div class="relative">
<input aria-describedby="temperature-error" class="w-full h-[56px] px-4 text-lg bg-surface border border-muted rounded-sm focus:outline-none focus:border-primary focus:border-2 transition-all duration-200 placeholder:text-muted" id="temperature-input" placeholder="e.g. 98.6" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-muted font-medium">°F</span>
</div>
<!-- Example Error State (Hidden by default) -->
<div class="hidden flex items-center gap-1 text-error text-sm mt-1" id="temperature-error">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
<span>Please enter a valid temperature.</span>
</div>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface border-t border-border-light shadow-clinical">
<button class="w-full h-[56px] bg-primary text-white font-semibold text-[16px] rounded-sm flex items-center justify-center hover:bg-opacity-90 active:bg-opacity-100 transition-colors">
            Next
        </button>
</div>
</body></html>
